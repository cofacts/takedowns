name: Execute Admin API Calls

on:
  pull_request:
    types: [closed]

jobs:
  execute-api:
    # Only run when PR is merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract API info
        id: api-info
        uses: ./.github/actions/extract-api-info
        with:
          pr-description: ${{ github.event.pull_request.body }}

      - name: Execute API calls
        if: steps.api-info.outputs.has-api-info == 'true' || steps.api-info.outputs.errors != ''
        uses: actions/github-script@v7
        env:
          COFACTS_ADMIN_API_URL: ${{ vars.COFACTS_ADMIN_API_URL }}
          COFACTS_ADMIN_CLIENT_ID: ${{ vars.COFACTS_ADMIN_CLIENT_ID }}
          COFACTS_ADMIN_CLIENT_SECRET: ${{ secrets.COFACTS_ADMIN_CLIENT_SECRET }}
          API_COMMANDS: ${{ steps.api-info.outputs.commands }}
          API_ERRORS: ${{ steps.api-info.outputs.errors }}
        with:
          script: |
            const { runApiCommands, formatResultsComment } = await import(
              `${process.env.GITHUB_WORKSPACE}/src/apiCommands.js`
            );
            const comment = (body) =>
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });

            // Malformed commands: run none of them
            if (process.env.API_ERRORS) {
              await comment(
                `❌ No API call was executed: the PR description has malformed commands.\n\n\`\`\`\n${process.env.API_ERRORS}\n\`\`\``
              );
              core.setFailed(process.env.API_ERRORS);
              return;
            }

            const results = await runApiCommands(
              JSON.parse(process.env.API_COMMANDS),
              async (endpoint, body) => {
                const apiUrl = `${process.env.COFACTS_ADMIN_API_URL}${endpoint}`;
                console.log(`Executing API call to: ${apiUrl}\nWith request body: ${body}`);
                const response = await fetch(apiUrl, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'CF-Access-Client-Id': process.env.COFACTS_ADMIN_CLIENT_ID,
                    'CF-Access-Client-Secret': process.env.COFACTS_ADMIN_CLIENT_SECRET,
                  },
                  body,
                });
                const text = await response.text();
                let data = text;
                try {
                  data = JSON.parse(text);
                } catch {
                  // Keep non-JSON responses (e.g. an HTML error page) as text
                }
                return { ok: response.ok, status: response.status, data };
              }
            );

            await comment(formatResultsComment(results));

            if (results.some(({ status }) => status !== 'SUCCESS')) {
              core.setFailed('Some API calls failed; see the PR comment.');
            }
