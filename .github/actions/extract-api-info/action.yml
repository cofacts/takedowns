name: "Extract API Info"
description: "Extract admin API commands from PR description. Requires the repository to be checked out."
inputs:
  pr-description:
    description: "The PR description to extract API commands from"
    required: true
outputs:
  commands:
    description: 'JSON array of {endpoint, body}, in the order they appear'
    value: ${{ steps.extract.outputs.commands }}
  errors:
    description: "Newline-separated errors for malformed commands; empty when there are none"
    value: ${{ steps.extract.outputs.errors }}
  has-api-info:
    description: "Whether at least one command was found and there are no errors"
    value: ${{ steps.extract.outputs.has-api-info }}
runs:
  using: "composite"
  steps:
    - name: Extract API commands
      id: extract
      uses: actions/github-script@v7
      env:
        PR_DESCRIPTION: ${{ inputs.pr-description }}
      with:
        script: |
          const { extractApiCommands } = await import(
            `${process.env.GITHUB_WORKSPACE}/src/apiCommands.js`
          );
          const { commands, errors } = extractApiCommands(process.env.PR_DESCRIPTION);

          commands.forEach(({ endpoint, body }, i) =>
            console.log(`Command #${i + 1}: ${endpoint}\n${body}`)
          );
          errors.forEach((error) => console.error(error));

          core.setOutput('commands', JSON.stringify(commands));
          core.setOutput('errors', errors.join('\n'));
          core.setOutput(
            'has-api-info',
            commands.length > 0 && errors.length === 0 ? 'true' : 'false'
          );
